name: 폴바셋 메뉴 자동 크롤링

# 언제 실행할지 설정 (매일 한국 시간 아침 8시)
on:
  schedule:
    # 깃허브 서버는 UTC(세계 표준시) 기준이므로 한국 시간(KST)보다 9시간 느립니다.
    # 한국 아침 8시 = UTC 전날 밤 23시
    - cron: '0 23 * * *'
  # 수동으로도 실행할 수 있도록 버튼 추가
  workflow_dispatch:

# 저장소에 파일을 쓰고 푸시(Push)할 수 있는 권한 부여
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # 깃허브가 제공하는 우분투 리눅스 서버 사용

    steps:
    # 1. 강승석님의 깃허브 코드를 서버로 복사해옵니다.
    - name: 저장소 체크아웃
      uses: actions/checkout@v3

    # 2. 파이썬 환경을 설치합니다.
    - name: 파이썬 3.10 셋팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 크롤링에 필요한 라이브러리 설치
    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 크롤러 스크립트 실행 (이때 menu.json이 새로 생성되거나 덮어써집니다)
    - name: 파이썬 크롤러 실행
      run: python crawler.py

    # 5. 변경된 menu.json 파일이 있으면 깃허브 저장소에 업로드(Commit & Push)합니다.
    - name: 변경된 데이터 저장 및 푸시
      run: |
        # 깃허브 봇 이름으로 설정
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 파일이 변경되었는지 확인하고 커밋합니다.
        git add menu.json
        git commit -m "🤖 자동 업데이트: 폴바셋 메뉴 데이터 갱신" || echo "변경된 메뉴가 없습니다."
        
        # [핵심 추가] 푸시하기 전에 원격 저장소의 최신 변경 사항을 먼저 가져와서 안전하게 합칩니다.
        git pull --rebase origin main
        
        # 합쳐진 최종본을 밀어넣습니다.
        git push
